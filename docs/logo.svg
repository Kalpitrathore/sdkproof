<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img">
  <title>SDKProof</title>
  <desc>The SDKProof mark, a terminal window holding a cat face, beside the lowercase sdkproof wordmark on a light card.</desc>

  <!-- The card is the ground: a README renders on light or dark and the wordmark
       has to hold on both, so it brings its own. -->
  <rect x="40" y="30" width="600" height="280" rx="28" fill="#f7f8f7"/>

  <!-- The mark's own coordinates run 104..272; this maps that square to a
       190px box at (76, 75) inside the card. -->
  <g transform="translate(-41.62 -20) scale(1.131)">
    <rect x="110" y="90" width="140" height="140" rx="34" fill="#0e1216"/>
    <path d="M110 120 H250" stroke="#2b3542" stroke-width="2.5"/>
    <circle cx="131" cy="105" r="5" fill="#3fd8b8"/>
    <circle cx="149" cy="105" r="5" fill="#39485a"/>
    <circle cx="167" cy="105" r="5" fill="#39485a"/>
    <g transform="translate(0 16) translate(180 168) scale(0.86) translate(-180 -168)">
      <polygon points="144,142 152,100 186,128" fill="#eef2f1"/>
      <polygon points="216,142 208,100 174,128" fill="#eef2f1"/>
      <polygon points="152,138 157,113 176,131" fill="#3fd8b8"/>
      <polygon points="208,138 203,113 184,131" fill="#3fd8b8"/>
      <ellipse cx="180" cy="168" rx="44" ry="38" fill="#eef2f1"/>
      <path d="M160 164 q7 -10 14 0" fill="none" stroke="#0e1216" stroke-width="5" stroke-linecap="round"/>
      <path d="M186 164 q7 -10 14 0" fill="none" stroke="#0e1216" stroke-width="5" stroke-linecap="round"/>
      <polygon points="174,176 186,176 180,184" fill="#3fd8b8"/>
      <path d="M180 184 q-6 9 -13 3" fill="none" stroke="#0e1216" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M180 184 q6 9 13 3" fill="none" stroke="#0e1216" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M138 168 H126 M138 180 H126 M222 168 H234 M222 180 H234" fill="none" stroke="#3fd8b8" stroke-width="3.6" stroke-linecap="round"/>
    </g>
  </g>

  <text x="300" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="76" letter-spacing="-2.4" fill="#0e1216">
    <tspan font-weight="400">sdk</tspan><tspan font-weight="750">proof</tspan>
  </text>
  <rect x="418" y="214" width="180" height="10" rx="5" fill="#0a7f74"/>
</svg>
